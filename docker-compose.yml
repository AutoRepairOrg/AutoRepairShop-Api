services:
  api:
    build:
      context: .
      dockerfile: src/AutoRepairShop.Api/Dockerfile
    container_name: autorepairshop-api
    depends_on:
      mailhog:
        condition: service_started
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}

      JWT__KEY: ${JWT_KEY}
      JWT__ISSUER: ${JWT_ISSUER}
      JWT__AUDIENCE: ${JWT_AUDIENCE}
      JWT__EXPIRESINMINUTES: ${JWT_EXPIRES_IN_MINUTES}

      Email__SmtpHost: mailhog
      Email__SmtpPort: 1025
      Email__FromAddress: noreply@autorepairshop.local
      Email__FromName: Auto Repair Shop
      Email__UseSsl: "false"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: autorepairshop-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"