name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - development
      - master

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: autorepairshop-api
  K8S_NAMESPACE: oficina
  EKS_CLUSTER: autorepairshop-eks
  AWS_REGION: us-east-1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AutoRepairShop.sln

      - name: Build
        run: dotnet build AutoRepairShop.sln --configuration Release --no-restore

     # - name: Test
      #  run: dotnet test AutoRepairShop.sln --configuration Release --no-build --verbosity normal

  publish-image:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image-meta.outputs.image }}
      image_latest: ${{ steps.image-meta.outputs.image_latest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image metadata
        id: image-meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LOWER}/${IMAGE_NAME}:${GITHUB_SHA}"
          IMAGE_LATEST="ghcr.io/${OWNER_LOWER}/${IMAGE_NAME}:latest"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE_LATEST}" >> "$GITHUB_OUTPUT"
          echo "Building image: ${IMAGE}"
          echo "Latest tag: ${IMAGE_LATEST}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/AutoRepairShop.Api/Dockerfile
          push: true
          tags: |
            ${{ steps.image-meta.outputs.image }}
            ${{ steps.image-meta.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development'
    needs: publish-image
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig (EKS)
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
          kubectl cluster-info
          kubectl get nodes

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create image pull secret
        run: |
          kubectl -n "${{ env.K8S_NAMESPACE }}" create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --docker-email="${{ github.actor }}@users.noreply.github.com" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Ensure api-secrets
        run: |
          kubectl -n "${{ env.K8S_NAMESPACE }}" create secret generic api-secrets \
            --from-literal=Jwt__Key="${{ secrets.JWT_KEY }}" \
            --from-literal=Jwt__Issuer="${{ secrets.JWT_ISSUER }}" \
            --from-literal=Jwt__Audience="${{ secrets.JWT_AUDIENCE }}" \
            --from-literal=Jwt__ExpiresInMinutes="${{ secrets.JWT_EXPIRES_IN_MINUTES }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Kubernetes manifests
        run: |
          # Se você tiver manifests no repo
          if [ -d "./k8s" ]; then
            kubectl apply -f ./k8s/ -n ${{ env.K8S_NAMESPACE }}
          fi

      - name: Update API image
        run: |
          kubectl -n "${{ env.K8S_NAMESPACE }}" set image deployment/api \
            api="${{ needs.publish-image.outputs.image }}" \
            --record
          
          kubectl -n "${{ env.K8S_NAMESPACE }}" rollout status deployment/api --timeout=300s

      - name: Verify deployment
        run: |
          kubectl -n "${{ env.K8S_NAMESPACE }}" get pods -l app=api
          kubectl -n "${{ env.K8S_NAMESPACE }}" get svc api
