name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - development
      - master

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: autorepairshop-api
  K8S_NAMESPACE: oficina
  EKS_CLUSTER: autorepairshop-eks
  AWS_REGION: us-east-1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AutoRepairShop.sln

      - name: Build
        run: dotnet build AutoRepairShop.sln --configuration Release --no-restore

  publish-image:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image-meta.outputs.image }}
      image_latest: ${{ steps.image-meta.outputs.image_latest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image metadata
        id: image-meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LOWER}/${IMAGE_NAME}:${GITHUB_SHA}"
          IMAGE_LATEST="ghcr.io/${OWNER_LOWER}/${IMAGE_NAME}:latest"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE_LATEST}" >> "$GITHUB_OUTPUT"
          echo "Building image: ${IMAGE}"
          echo "Latest tag: ${IMAGE_LATEST}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/AutoRepairShop.Api/Dockerfile
          push: true
          tags: |
            ${{ steps.image-meta.outputs.image }}
            ${{ steps.image-meta.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Manifests, secrets e config do cluster ficam no AutoRepairShop-Kubernetes.
  # Aqui só atualizamos a image do Deployment já existente.
  update-image:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development'
    needs: publish-image
    runs-on: ubuntu-latest

    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig (EKS)
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
          kubectl cluster-info
          kubectl get nodes

      - name: Ensure GHCR image pull secret
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -z "$GHCR_USERNAME" ] || [ -z "$GHCR_PAT" ]; then
            echo "Missing secrets GHCR_USERNAME and/or GHCR_PAT (needs read:packages)."
            exit 1
          fi

          kubectl -n "${{ env.K8S_NAMESPACE }}" create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_PAT" \
            --docker-email="${GHCR_USERNAME}@users.noreply.github.com" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n "${{ env.K8S_NAMESPACE }}" patch deployment api --type=strategic -p \
            '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"ghcr-secret"}]}}}}'

      - name: Update API image
        run: |
          kubectl -n "${{ env.K8S_NAMESPACE }}" set image deployment/api \
            api="${{ needs.publish-image.outputs.image }}"

          kubectl -n "${{ env.K8S_NAMESPACE }}" rollout status deployment/api --timeout=600s

      - name: Verify deployment
        run: |
          kubectl -n "${{ env.K8S_NAMESPACE }}" get pods -l app=api
          kubectl -n "${{ env.K8S_NAMESPACE }}" get svc api
          kubectl -n "${{ env.K8S_NAMESPACE }}" get svc api-nlb
