name: CD
 
on:
  workflow_dispatch:
  push:
    branches:
      - development
      - master
 
permissions:
  contents: read
  packages: write
 
env:
  IMAGE_NAME: autorepairshop-api
  K8S_NAMESPACE: oficina
  EKS_CLUSTER: autorepairshop-eks
  AWS_REGION: us-east-1
 
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: 8.0.x
 
      - name: Restore
        run: dotnet restore AutoRepairShop.sln
 
      - name: Build
        run: dotnet build AutoRepairShop.sln --configuration Release --no-restore
 
      - name: Test
        run: dotnet test AutoRepairShop.sln --configuration Release --no-build --verbosity normal
 
  publish-image:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image-meta.outputs.image }}
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set image metadata
        id: image-meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LOWER}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
 
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
 
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/AutoRepairShop.Api/Dockerfile
          push: true
          tags: |
            ${{ steps.image-meta.outputs.image }}
            ghcr.io/${{ steps.image-meta.outputs.owner_lower }}/${{ env.IMAGE_NAME }}:latest
 
  deploy:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development'
    needs: publish-image
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}
 
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4.0.0
 
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
 
      - name: Update kubeconfig (EKS)
        run: |
          aws eks update-kubeconfig --name "${EKS_CLUSTER}" --region "${AWS_REGION}"
          kubectl get nodes
 
      - name: Create image pull secret
        run: |
          kubectl -n "${K8S_NAMESPACE}" create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ secrets.GHCR_USERNAME }}" \
            --docker-password="${{ secrets.GHCR_TOKEN }}" \
            --docker-email="${{ secrets.GHCR_EMAIL }}" \
            --dry-run=client -o yaml | kubectl apply -f -
 
      - name: Ensure api-secrets
        run: |
          kubectl -n "${K8S_NAMESPACE}" create secret generic api-secrets \
            --from-literal=Jwt__Key="${{ secrets.JWT_KEY }}" \
            --from-literal=Jwt__Issuer="${{ secrets.JWT_ISSUER }}" \
            --from-literal=Jwt__Audience="${{ secrets.JWT_AUDIENCE }}" \
            --from-literal=Jwt__ExpiresInMinutes="${{ secrets.JWT_EXPIRES_IN_MINUTES }}" \
            --dry-run=client -o yaml | kubectl apply -f -
 
      - name: Update API image
        run: |
          kubectl -n "${K8S_NAMESPACE}" set image deployment/api api="${{ needs.publish-image.outputs.image }}"
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/api --timeout=180s
